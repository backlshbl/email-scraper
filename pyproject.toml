[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "email-lead-scraper"
dynamic = ["version"]
description = "Find publicly listed business contact emails and optionally enrich them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "ddgs>=9,<10",
    "email-validator>=2.2,<3",
    "httpx>=0.27,<1",
    "rapidfuzz>=3.9,<4",
    "requests>=2.28,<3",
    "tldextract>=5.1,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
email-lead-scraper = "email_lead_scraper.cli:main"
email-lead-merge = "email_lead_scraper.storage:merge_main"
email-lead-brevo-sync = "email_lead_scraper.brevo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "email_lead_scraper.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
