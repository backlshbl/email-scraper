name: Website Email Scraper (Marketing Contacts)

on:
  # Manual trigger only — add URLs to config/websites.txt, then run this workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore crawl cache
        uses: actions/cache@v4
        with:
          path: output/crawl_cache.sqlite
          key: website-crawl-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            website-crawl-cache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Scrape websites for marketing emails
        run: |
          if [ -s config/websites.txt ] && grep -v '^\s*#' config/websites.txt | grep -q '\S'; then
            email-lead-scraper \
              --websites-file config/websites.txt \
              --filter-roles \
                "Marketing Head" \
                "Marketing Director" \
                "Head of Marketing" \
                "Marketing Manager" \
                "CMO" \
                "Chief Marketing Officer" \
                "VP Marketing" \
                "Vice President Marketing" \
                "Digital Marketing" \
              --fresh-output \
              --output output/leads_websites_today.csv
          else
            echo "No websites in config/websites.txt — nothing to scrape."
            exit 0
          fi

      - name: Merge into cumulative CSV
        run: |
          if [ -f output/leads_websites_today.csv ]; then
            email-lead-merge output/leads_websites_today.csv output/leads_websites.csv
          fi

      - name: Generate run summary
        run: |
          echo "## 📧 Website Scraper — Marketing Contacts — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Filter:** Marketing roles only (Marketing Head, CMO, Marketing Director, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/leads_websites_today.csv ]; then
            COUNT=$(tail -n +2 output/leads_websites_today.csv | wc -l)
            echo "**Emails found:** ${COUNT}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Emails found:** 0" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/leads_websites.csv ]; then
            TOTAL=$(tail -n +2 output/leads_websites.csv | wc -l)
            echo "**Cumulative total:** ${TOTAL} unique emails" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/leads_websites.csv output/leads_websites_today.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new marketing emails found — skipping commit."
          else
            git commit -m "📧 Website scrape: $(date -u '+%Y-%m-%d') — marketing contacts"
            git push
          fi
